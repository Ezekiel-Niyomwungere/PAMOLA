{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}PAMOLA Agribusiness{% endblock %}</title>

    <meta
        name="description"
        content="{% block meta_description %}PAMOLA Agribusiness - Value Starts Here.{% endblock %}"
    >

    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>

<body>

    <header class="site-header">
        <div class="container header-inner">
            <a href="{% url 'core:home' %}" class="site-logo">PAMOLA</a>
            <nav class="site-nav" aria-label="Main navigation">
                <a href="{% url 'core:home' %}">Home</a>
                <a href="{% url 'contact:contact' %}" class="{% if request.resolver_match.app_name == 'contact' %}active{% endif %}">Contact</a>
            </nav>
        </div>
    </header>

    {% if messages %}
        <div class="messages-container">
            <div class="container">
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }}" role="alert">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
        </div>
    {% endif %}

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; {% now "Y" %} PAMOLA Agribusiness. Value Starts Here.</p>
        </div>
    </footer>

    <script src="{% static 'js/main.js' %}"></script>

</body>
</html>
